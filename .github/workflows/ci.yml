name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: it may be tagging a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep native assets LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Rust checks
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check native runtime
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 clippy --locked --all-targets -- -D warnings
          cargo +1.95.0 test --locked
          node native/tests/parity.cjs
      - name: Verify automatic native installation
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: |
          python3 maintainer/test-bootstrap.py
          binary=target/debug/exonous
          if [ '${{ runner.os }}' = Windows ]; then binary="$binary.exe"; fi
          python3 maintainer/test-bootstrap.py --binary "$binary"
      - name: Verify PowerShell 7 bootstrap compatibility
        if: runner.os == 'Windows'
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: |
          python3 maintainer/test-bootstrap.py --powershell pwsh
          python3 maintainer/test-bootstrap.py --powershell pwsh --binary target/debug/exonous.exe

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            node: 18
    defaults:
      run:
        # Git Bash on Windows: expands test/*.test.js (pwsh/cmd hand node the literal glob).
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        env:
          EXONOUS_HOME: ${{ runner.temp }}/exonous-home
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
          EXONOUS_NO_UPDATE: '1'
          # Git for Windows maps this literal itself; NUL fails its config access check.
          GIT_CONFIG_GLOBAL: /dev/null
        # Same as `npm test`, run directly: npm uses cmd.exe on Windows, which leaves the glob unexpanded.
        run: |
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --version
          node --test test/*.test.js

  wsl:
    name: test (wsl ubuntu-24.04)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: nodejs git python3

      - name: Test
        shell: wsl-bash {0}
        # Copy to the Linux filesystem: /mnt/* (drvfs) has no POSIX modes and is slow. Windows env vars do not cross into WSL, so export them here.
        run: |
          set -euo pipefail
          node --version
          src="$(pwd)"
          work="$(mktemp -d)"
          cp -r "$src" "$work/repo"
          cd "$work/repo"
          find . -path ./.git -prune -o -type f -exec chmod 644 {} +
          git -c safe.directory='*' ls-files -s | awk '$1 == "100755" { print $4 }' | xargs -r chmod 755
          export EXONOUS_HOME="$work/exonous-home" HOME="$work/home" EXONOUS_NO_UPDATE=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --test test/*.test.js
          python3 maintainer/test-bootstrap.py

  version:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Shipped changes raise the version
        env:
          BASE: ${{ github.base_ref }}
        run: node maintainer/release.js check "origin/$BASE"

  release-checks:
    name: release checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, test, wsl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: New version?
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ -n "$(git tag --list "v$v")" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pre-release checks
        if: steps.version.outputs.new == 'true'
        env:
          EXONOUS_SOURCE_01_URL: ${{ secrets.EXONOUS_SOURCE_01_URL }}
          EXONOUS_SOURCE_02_URL: ${{ secrets.EXONOUS_SOURCE_02_URL }}
          EXONOUS_SOURCE_03_URL: ${{ secrets.EXONOUS_SOURCE_03_URL }}
          EXONOUS_SOURCE_04_URL: ${{ secrets.EXONOUS_SOURCE_04_URL }}
          EXONOUS_SOURCE_05_URL: ${{ secrets.EXONOUS_SOURCE_05_URL }}
          EXONOUS_SOURCE_06_URL: ${{ secrets.EXONOUS_SOURCE_06_URL }}
          EXONOUS_SOURCE_07_URL: ${{ secrets.EXONOUS_SOURCE_07_URL }}
          EXONOUS_SOURCE_08_URL: ${{ secrets.EXONOUS_SOURCE_08_URL }}
          EXONOUS_SOURCE_09_URL: ${{ secrets.EXONOUS_SOURCE_09_URL }}
          EXONOUS_SOURCE_10_URL: ${{ secrets.EXONOUS_SOURCE_10_URL }}
          EXONOUS_SOURCE_11_URL: ${{ secrets.EXONOUS_SOURCE_11_URL }}
          EXONOUS_SOURCE_12_URL: ${{ secrets.EXONOUS_SOURCE_12_URL }}
          EXONOUS_SOURCE_13_URL: ${{ secrets.EXONOUS_SOURCE_13_URL }}
          EXONOUS_SOURCE_14_URL: ${{ secrets.EXONOUS_SOURCE_14_URL }}
          EXONOUS_SOURCE_15_URL: ${{ secrets.EXONOUS_SOURCE_15_URL }}
        run: |
          bash maintainer/e2e-smoke.sh
          npm run pege:originality

  native-bundles:
    name: bundle (${{ matrix.target }})
    needs: release-checks
    if: needs.release-checks.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep release assets LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build native release
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 build --release --locked --target '${{ matrix.target }}'
          binary='target/${{ matrix.target }}/release/exonous'
          if [ '${{ runner.os }}' = Windows ]; then binary="$binary.exe"; fi
          python3 maintainer/package-native.py --binary "$binary" --target '${{ matrix.target }}' --output dist
          python3 maintainer/test-bootstrap.py --binary "$binary" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: release native bundles
    needs: [release-checks, native-bundles]
    if: needs.release-checks.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The quanthub mirror copies new tags within the hour (its own sync workflow).
      - name: Tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node maintainer/release.js tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Publish verified bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./package.json').version")"
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "v$v" dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "Exonous v$v" --generate-notes
